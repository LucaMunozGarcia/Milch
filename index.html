<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bananenmilch-Fänger 🥛 Cartoon-Edition</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#bfe3ff;
    font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',system-ui,sans-serif; }
  #game { position:fixed; inset:0; display:block; touch-action:none; }
  .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(10,40,25,.4); backdrop-filter:blur(2px); z-index:5; overflow:auto; padding:12px; }
  .card { background:#fff; border-radius:24px; padding:24px 28px; text-align:center;
    box-shadow:0 18px 50px rgba(0,0,0,.35); border-top:10px solid #00963f;
    max-width:92vw; max-height:94vh; overflow:auto; }
  .card.wide { max-width:700px; }
  h1 { font-size:clamp(24px,5vw,36px); color:#007a33; margin-bottom:4px; }
  h2 { font-size:clamp(20px,4vw,30px); color:#007a33; margin-bottom:6px; }
  .sub { color:#888; margin-bottom:10px; font-size:14px; }
  p { color:#444; font-size:clamp(13px,2.6vw,16px); line-height:1.45; margin-bottom:6px; }
  .score { font-size:clamp(20px,4vw,28px); color:#007a33; font-weight:800; margin:6px 0; }
  button { font-family:inherit; }
  #startBtn, #againBtn { margin-top:12px; background:#00963f; color:#fff; border:0; border-radius:999px;
    font-size:clamp(16px,3vw,20px); font-weight:700; padding:13px 36px; cursor:pointer;
    box-shadow:0 6px 0 #006b2d; transition:transform .08s, box-shadow .08s; }
  #startBtn:hover, #againBtn:hover { transform:translateY(2px); box-shadow:0 4px 0 #006b2d; }
  #startBtn:active, #againBtn:active { transform:translateY(5px); box-shadow:0 1px 0 #006b2d; }
  .linklike { background:none; border:none; color:#999; text-decoration:underline; cursor:pointer;
    font-size:12px; margin-top:12px; }
  .linklike:hover { color:#c62828; }
  .xpbox { margin:8px auto 10px; max-width:340px; }
  .xpline { display:flex; justify-content:space-between; font-size:13px; color:#007a33; font-weight:700; margin-bottom:4px; }
  .bar { height:10px; background:#e0efe4; border-radius:99px; overflow:hidden; }
  .bar > div { height:100%; background:linear-gradient(90deg,#7ed957,#00963f); width:0%; transition:width .3s; }
  .legend { display:flex; gap:12px; justify-content:center; align-items:flex-end; margin:8px 0 12px; flex-wrap:wrap; }
  .lg { display:flex; flex-direction:column; align-items:center; font-size:12px; color:#555; }
  .lg img { height:60px; filter:drop-shadow(0 3px 3px rgba(0,0,0,.25)); }
  .lg b { margin-top:2px; }
  .diffs { display:grid; grid-template-columns:repeat(2,minmax(130px,1fr)); gap:8px; margin:0 auto 10px; max-width:430px; }
  .diff { background:#f2faf4; border:2px solid #bfe3c8; border-radius:14px; padding:8px 10px; cursor:pointer;
    display:flex; flex-direction:column; gap:2px; align-items:center; transition:all .12s; }
  .diff .dn { font-weight:800; color:#224433; font-size:15px; }
  .diff .ds { font-size:11px; color:#777; }
  .diff.sel { border-color:#00963f; background:#e0f5e6; box-shadow:0 0 0 3px rgba(0,150,63,.2); }
  .diff.locked { opacity:.55; cursor:not-allowed; background:#eee; border-color:#ddd; }
  .best { font-size:14px; color:#007a33; font-weight:700; margin-bottom:2px; }
  .stats { font-size:12px; color:#888; margin-top:10px; }
  .hint { font-size:12px; color:#999; margin-top:8px; }
  #sndBtn { position:fixed; top:58px; right:12px; z-index:6; width:44px; height:44px; border-radius:50%;
    border:0; background:rgba(255,255,255,.88); font-size:20px; cursor:pointer; box-shadow:0 3px 8px rgba(0,0,0,.25); }
  .skills { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
  .skillCard { width:172px; background:#f7fbf7; border:3px solid #bfe3c8; border-radius:18px; padding:14px 10px;
    cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px;
    transition:transform .1s, border-color .1s; }
  .skillCard:hover { transform:translateY(-4px); border-color:#00963f; background:#eaf7ee; }
  .skillCard .em { font-size:34px; }
  .skillCard .nm { font-weight:800; color:#007a33; font-size:15px; }
  .skillCard .ds { font-size:12px; color:#555; line-height:1.3; }
  .skillCard .st { font-size:11px; color:#999; background:#eef4ef; border-radius:99px; padding:2px 10px; }
  .hidden { display:none !important; }
</style>
</head>

/* ================= Sound ================= */
let AC = null;
function beep(freq, dur, type, vol, slide) {
  if (!save.snd) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(freq, AC.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, AC.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.2, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  } catch (e) {}
}

/* ================= Run-Logik ================= */
function newRun() {
  const d = DIFFS[save.diff];
  run = { diff:save.diff, score:0, xpCur:0, level:1, need:12, combo:0,
    hearts:d.hearts, maxHearts:d.hearts, skills:{}, wMul:1, magnet:0, slow:1,
    luck:1, comboStep:4, feather:0, boost:1, catches:0, misses:0, pending:0 };
  basket.w = 120;
}
function comboMult() { return 1 + Math.floor(run.combo / run.comboStep) * 0.5; }
function applySkill(id) {
  run.skills[id] = (run.skills[id] || 0) + 1;
  switch (id) {
    case "basket":  run.wMul *= 1.12; basket.w = Math.round(120 * run.wMul); break;
    case "magnet":  run.magnet += 0.8; break;
    case "slow":    run.slow *= 0.93; break;
    case "heart":   run.maxHearts++; run.hearts = Math.min(run.maxHearts, run.hearts + 1); break;
    case "luck":    run.luck *= 1.4; break;
    case "combo":   run.comboStep = Math.max(2, run.comboStep - 1); break;
    case "feather": run.feather++; break;
    case "boost":   run.boost += 0.1; break;
  }
}
function pickType() {
  const d = DIFFS[run.diff], L = run.luck;
  const w = [["banane",60],["erdbeer",20*L],["blaubeer",10*L],["gold",4*L],["sauer",d.sour]];
  let tot = 0; for (const x of w) tot += x[1];
  let r = Math.random() * tot;
  for (const x of w) { r -= x[1]; if (r < 0) return x[0]; }
  return "banane";
}
function spawnBottle() {
  const t = pickType(), T = TYPES[t], d = DIFFS[run.diff];
  const h = (100 + Math.random() * 45) * T.size, w = h * ASPECT;
  bottles.push({ type:t, x:w/2 + 16 + Math.random() * Math.max(40, W - w - 32), y:-h - 12, w, h,
    vy: Math.min(560 * d.speed, (140 + run.score * 4) * d.speed * T.spd * run.slow),
    rot:(Math.random() - 0.5) * 0.22, vr:(Math.random() - 0.5) * 0.7 });
}

/* ================= Skill-Auswahl ================= */
function openSkills() {
  setState("skill");
  document.getElementById("skillTitle").textContent = "⬆️ Level " + run.level + "!";
  const avail = SKILLS.filter(s => (run.skills[s.id] || 0) < s.max);
  for (let i = avail.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [avail[i], avail[j]] = [avail[j], avail[i]]; }
  const box = document.getElementById("skillCards");
  box.innerHTML = "";
  avail.slice(0, 3).forEach(s => {
    const cur = run.skills[s.id] || 0;
    const b = document.createElement("button");
    b.className = "skillCard";
    b.innerHTML = '<span class="em">' + s.em + '</span><span class="nm">' + s.name +
      '</span><span class="ds">' + s.desc + '</span><span class="st">Stufe ' + (cur + 1) + "/" + s.max + "</span>";
    b.onclick = () => {
      applySkill(s.id); run.pending--;
      beep(700, 0.15, "triangle", 0.2, 1100);
      if (run.pending > 0) openSkills();
      else { document.getElementById("skillOv").classList.add("hidden"); setState("play"); }
    };
    box.appendChild(b);
  });
  document.getElementById("skillOv").classList.remove("hidden");
}

/* ================= Start / GameOver / Menü ================= */
function start() {
  newRun();
  bottles = []; drops = []; pops = [];
  spawnT = 0.8; flashT = 0;
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("over").classList.add("hidden");
  document.getElementById("skillOv").classList.add("hidden");
  setState("play");
  beep(520, 0.12, "triangle", 0.2, 780);
}
function gameOver() {
  setState("over");
  save.games++; save.catches += run.catches; save.misses += run.misses; save.xp += run.score;
  const d = run.diff, isBest = run.score > save.best[d];
  if (isBest) save.best[d] = run.score;
  persist();
  document.getElementById("finalScore").textContent = "🥛 " + run.score + " Punkte!";
  document.getElementById("finalXp").textContent = "＋" + run.score + " XP gesamt · Level " + run.level + " erreicht";
  document.getElementById("bestLine2").textContent = isBest
    ? "🏆 Neuer Rekord in " + DIFFS[d].name + "!"
    : "Rekord (" + DIFFS[d].name + "): " + save.best[d];
  document.getElementById("runStats").textContent =
    run.catches + " Flaschen gefangen · " + run.misses + " daneben";
  document.getElementById("over").classList.remove("hidden");
  beep(220, 0.4, "sawtooth", 0.15, 70);
}
function renderMenu() {
  const lvl = Math.floor(save.xp / 100) + 1, prog = save.xp % 100;
  document.getElementById("accLevel").textContent = "⭐ Spieler-Level " + lvl;
  document.getElementById("accXpTxt").textContent = prog + "/100 XP";
  document.getElementById("accBar").style.width = prog + "%";
  const box = document.getElementById("diffs");
  box.innerHTML = "";
  for (const k in DIFFS) {
    const d = DIFFS[k], locked = save.xp < d.unlock;
    const b = document.createElement("button");
    b.className = "diff" + (save.diff === k ? " sel" : "") + (locked ? " locked" : "");
    b.innerHTML = '<span class="dn">' + d.em + " " + d.name + '</span><span class="ds">' +
      (locked ? "🔒 ab " + d.unlock + " XP gesamt" : "Rekord: " + save.best[k]) + "</span>";
    if (!locked) b.onclick = () => { save.diff = k; persist(); renderMenu(); beep(500, 0.08, "triangle", 0.15); };
    box.appendChild(b);
  }
  document.getElementById("bestLine").textContent =
    "Rekord (" + DIFFS[save.diff].name + "): " + save.best[save.diff] + " Punkte";
  document.getElementById("statsLine").textContent =
    "🎮 " + save.games + " Spiele · 🥛 " + save.catches + " gefangen · 💥 " + save.misses + " daneben";
  document.getElementById("sndBtn").textContent = save.snd ? "🔊" : "🔇";
}

document.getElementById("startBtn").onclick = start;
document.getElementById("againBtn").onclick = start;
document.getElementById("menuBtn").onclick = () => {
  document.getElementById("over").classList.add("hidden");
  document.getElementById("menu").classList.remove("hidden");
  renderMenu(); setState("menu");
};
document.getElementById("sndBtn").onclick = () => {
  save.snd = !save.snd; persist();
  document.getElementById("sndBtn").textContent = save.snd ? "🔊" : "🔇";
  if (save.snd) beep(600, 0.1, "triangle", 0.2);
};
let resetArm = 0;
document.getElementById("resetBtn").onclick = function () {
  if (resetArm && Date.now() - resetArm < 3000) {
    save = defSave(); persist(); resetArm = 0; renderMenu();
    this.textContent = "✔ Gelöscht!";
    setTimeout(() => { this.textContent = "Speicherstand löschen"; }, 1500);
  } else {
    resetArm = Date.now();
    this.textContent = "⚠️ Wirklich? Nochmal klicken!";
  }
};

/* ================= Steuerung ================= */
window.addEventListener("keydown", e => {
  if (["ArrowLeft","ArrowRight"," ","a","d","A","D"].includes(e.key)) e.preventDefault();
  keys[e.key] = true;
  if ((e.key === " " || e.key === "Enter") && (state === "menu" || state === "over")) start();
});
window.addEventListener("keyup", e => { keys[e.key] = false; });
window.addEventListener("pointermove", e => { targetX = e.clientX; });
window.addEventListener("touchmove", e => { targetX = e.touches[0].clientX; e.preventDefault(); }, { passive:false });

/* ================= Helpers ================= */
function rr(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
}
function splash(x, y, n, col) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI - Math.PI, sp = 90 + Math.random() * 220;
    drops.push({ x, y, vx:Math.cos(a)*sp*0.7, vy:-Math.abs(Math.sin(a))*sp - 60,
      r:2 + Math.random()*4, t:0.7 + Math.random()*0.4, col });
  }
}

/* ================= Update ================= */
function update(dt) {
  time += dt;
  for (const c of clouds) { c.x += c.v * dt; if (c.x > 1.2) c.x = -0.2; }
  basket.squash = Math.max(0, basket.squash - dt * 4);
  flashT = Math.max(0, flashT - dt);
  basket.y = H - GRASS_H - basket.h + 10;

  if (state === "play" && run) {
    const d = DIFFS[run.diff];
    if (keys.ArrowLeft || keys.a || keys.A) targetX -= 460 * dt;
    if (keys.ArrowRight || keys.d || keys.D) targetX += 460 * dt;
    targetX = Math.max(basket.w / 2 + 4, Math.min(W - basket.w / 2 - 4, targetX));
    basket.x += (targetX - basket.x) * Math.min(1, dt * 16);

    spawnT -= dt;
    if (spawnT <= 0) {
      spawnBottle();
      spawnT = Math.max(0.45, d.spawn - run.score * 0.012) + Math.random() * 0.3;
    }

    const win = 42 + 16 * run.feather;
    for (let i = bottles.length - 1; i >= 0; i--) {
      const b = bottles[i], T = TYPES[b.type];
      b.y += b.vy * dt; b.rot += b.vr * dt;
      if (!T.bad && run.magnet) b.x += (basket.x - b.x) * Math.min(1, dt * run.magnet);
      const bottom = b.y + b.h;
      if (bottom >= basket.y + 8 && bottom <= basket.y + 8 + win &&
          Math.abs(b.x - basket.x) < basket.w / 2 + b.w * 0.15) {
        bottles.splice(i, 1);
        basket.squash = 1;
        if (T.bad) {
          run.hearts--; run.combo = 0; flashT = 0.4;
          splash(b.x, basket.y + 6, 16, "150,190,120");
          pops.push({ x:b.x, y:basket.y - 14, txt:"Bäh! ☠️", col:"#5d4037", t:1 });
          beep(120, 0.3, "sawtooth", 0.16, 60);
          if (run.hearts <= 0) { gameOver(); return; }
        } else {
          const pts = Math.max(1, Math.round(T.pts * comboMult() * run.boost));
          run.score += pts; run.catches++; run.combo++; run.xpCur += pts;
          splash(b.x, basket.y + 6, 14, "255,255,255");
          pops.push({ x:b.x, y:basket.y - 14, txt:"+" + pts, col: pts >= 5 ? "#c79100" : "#007a33", t:0.9 });
          beep(560 + Math.min(run.combo, 16) * 30, 0.11, "triangle", 0.2, 900);
          while (run.xpCur >= run.need) {
            run.xpCur -= run.need; run.level++; run.need = 12 + (run.level - 1) * 8; run.pending++;
          }
          if (run.pending > 0) { openSkills(); return; }
        }
      } else if (b.y > H + 10) {
        bottles.splice(i, 1);
        if (!T.bad) {
          run.misses++; run.combo = 0; run.hearts--; flashT = 0.35;
          splash(b.x, H - GRASS_H, 12, "255,240,220");
          pops.push({ x:b.x, y:H - GRASS_H - 30, txt:"Daneben!", col:"#c62828", t:0.9 });
          beep(150, 0.25, "sawtooth", 0.13, 75);
          if (run.hearts <= 0) { gameOver(); return; }
        } else {
          splash(b.x, H - GRASS_H, 10, "150,190,120");
        }
      }
    }
  }

  for (let i = drops.length - 1; i >= 0; i--) {
    const dd = drops[i];
    dd.t -= dt; dd.x += dd.vx * dt; dd.y += dd.vy * dt; dd.vy += 750 * dt;
    if (dd.t <= 0) drops.splice(i, 1);
  }
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i];
    p.t -= dt; p.y -= 45 * dt;
    if (p.t <= 0) pops.splice(i, 1);
  }
}

/* ================= Draw ================= */
function drawBasket() {
  const { x, y, w, h } = basket;
  ctx.save();
  ctx.translate(x, y + h);
  const s = basket.squash * 0.12;
  ctx.scale(1 + s, 1 - s);
  ctx.translate(0, -h);
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, "#b07b3e"); g.addColorStop(1, "#7c5220");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-w / 2, 0); ctx.lineTo(w / 2, 0);
  ctx.lineTo(w * 0.36, h); ctx.lineTo(-w * 0.36, h);
  ctx.closePath(); ctx.fill();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = "rgba(60,35,10,.35)"; ctx.lineWidth = 3;
  for (let yy = 10; yy < h; yy += 12) { ctx.beginPath(); ctx.moveTo(-w / 2, yy); ctx.lineTo(w / 2, yy); ctx.stroke(); }
  ctx.strokeStyle = "rgba(255,220,160,.25)"; ctx.lineWidth = 4;
  for (let xx = -w / 2; xx < w / 2; xx += 16) { ctx.beginPath(); ctx.moveTo(xx + 6, 0); ctx.lineTo(xx + 2, h); ctx.stroke(); }
  ctx.restore();
  ctx.fillStyle = "#c98f4a";
  rr(-w / 2 - 7, -12, w + 14, 18, 9); ctx.fill();
  ctx.strokeStyle = "#6b4416"; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}
function draw() {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#aee1ff"); sky.addColorStop(0.7, "#dff3ff"); sky.addColorStop(1, "#eaffe9");
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "rgba(255,236,140,.9)";
  ctx.beginPath(); ctx.arc(W - 80, 80, 38, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(255,236,140,.35)";
  ctx.beginPath(); ctx.arc(W - 80, 80, 56, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.85)";
  for (const c of clouds) {
    const cx = c.x * W, cy = c.y * H, s = c.s;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 46*s, 18*s, 0, 0, 7);
    ctx.ellipse(cx + 30*s, cy - 10*s, 30*s, 15*s, 0, 0, 7);
    ctx.ellipse(cx - 32*s, cy - 6*s, 26*s, 13*s, 0, 0, 7);
    ctx.fill();
  }
  ctx.fillStyle = "rgba(120,200,110,.45)";
  ctx.beginPath(); ctx.ellipse(W*0.2, H-GRASS_H+20, W*0.45, 90, 0, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.ellipse(W*0.85, H-GRASS_H+20, W*0.5, 120, 0, Math.PI, 0); ctx.fill();
  const gg = ctx.createLinearGradient(0, H-GRASS_H, 0, H);
  gg.addColorStop(0, "#86d24f"); gg.addColorStop(1, "#4e9c2e");
  ctx.fillStyle = gg; ctx.fillRect(0, H-GRASS_H, W, GRASS_H);

  drawBasket();

  for (const b of bottles) {
    const img = SPR[b.type];
    if (!img.complete || !img.naturalWidth) continue;
    const cy = b.y + b.h / 2;
    if (TYPES[b.type].glow) {
      const gl = ctx.createRadialGradient(b.x, cy, 4, b.x, cy, b.h * 0.75);
      gl.addColorStop(0, "rgba(255,215,80,.55)"); gl.addColorStop(1, "rgba(255,215,80,0)");
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(b.x, cy, b.h * 0.75, 0, 7); ctx.fill();
    }
    ctx.save();
    ctx.translate(b.x, cy); ctx.rotate(b.rot);
    ctx.drawImage(img, -b.w / 2, -b.h / 2, b.w, b.h);
    ctx.restore();
  }

  for (const dd of drops) {
    ctx.fillStyle = "rgba(" + dd.col + "," + Math.max(0, dd.t).toFixed(2) + ")";
    ctx.beginPath(); ctx.arc(dd.x, dd.y, dd.r, 0, 7); ctx.fill();
  }
  for (const p of pops) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.t * 1.6));
    ctx.font = "800 24px " + FONT;
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.lineWidth = 4; ctx.strokeStyle = "rgba(255,255,255,.9)";
    ctx.strokeText(p.txt, p.x, p.y);
    ctx.fillStyle = p.col; ctx.fillText(p.txt, p.x, p.y);
    ctx.globalAlpha = 1;
  }

  /* HUD */
  if (run && state !== "menu") {
    ctx.textBaseline = "middle";
    const mult = comboMult();
    const txt = "🥛 " + run.score + (mult > 1 ? "   🔥 x" + (Math.round(mult * 10) / 10) : "");
    ctx.font = "800 20px " + FONT;
    const tw = ctx.measureText(txt).width + 30;
    ctx.fillStyle = "rgba(0,70,35,.55)";
    rr(12, 12, tw, 40, 14); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.textAlign = "left";
    ctx.fillText(txt, 27, 33);
    /* Level-Pill + XP-Bar */
    const lw = 150;
    const lx = W < 620 ? 12 : W / 2 - lw / 2;
    const ly = W < 620 ? 60 : 12;
    ctx.fillStyle = "rgba(0,70,35,.55)";
    rr(lx, ly, lw, 36, 14); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = "700 14px " + FONT; ctx.textAlign = "center";
    ctx.fillText("Lv " + run.level, lx + lw / 2, ly + 12);
    ctx.fillStyle = "rgba(255,255,255,.3)";
    rr(lx + 12, ly + 24, lw - 24, 7, 4); ctx.fill();
    const pw = (lw - 24) * Math.min(1, run.xpCur / run.need);
    if (pw > 2) { ctx.fillStyle = "#7ed957"; rr(lx + 12, ly + 24, pw, 7, 4); ctx.fill(); }
    /* Herzen */
    ctx.font = "28px " + FONT; ctx.textAlign = "right";
    for (let i = 0; i < run.maxHearts; i++) {
      const alive = i < run.hearts;
      ctx.globalAlpha = alive ? 1 : 0.25;
      ctx.fillStyle = alive ? "#e53935" : "#555";
      ctx.fillText("♥", W - 16 - i * 34, 32);
    }
    ctx.globalAlpha = 1; ctx.textBaseline = "alphabetic";
  }

  if (flashT > 0) {
    ctx.fillStyle = "rgba(220,40,40," + (flashT * 0.5).toFixed(2) + ")";
    ctx.fillRect(0, 0, W, H);
  }
}

/* ================= Loop ================= */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
renderMenu();
requestAnimationFrame(loop);
</script>
</body>
</html>
